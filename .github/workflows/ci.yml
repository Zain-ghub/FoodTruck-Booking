name: Run Tests

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
  
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 9.0.x

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore 

            - name: Run Tests
              run: dotnet test --no-build --verbosity normal
    client:
       runs-on: ubuntu-latest
       defaults:
         run:
           working-directory: foodtruck-client
       steps:
         - uses: actions/checkout@v4

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
             node-version: '22'
             cache: npm
             cache-dependency-path: foodtruck-client/package-lock.json

         - name: Install dependencies
           run: npm ci

         - name: Build Angular app
           run: npm run build

